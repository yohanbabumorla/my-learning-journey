<style>
  .Request-button {
    background-color: black;
    color: white;
    cursor: pointer;
    height: 40px;
    width: 120px;
    font-size: 13px;
    transition: opacity 0.15s;
    margin-right: 8px;
    border-style: solid;
    margin-bottom: 10px;
  }
  .Request-button:hover {
    opacity: 0.7;
  }
  .Request-button:active {
    opacity: 0.5;
  }
  .Addtocart-button {
    height: 40px;
    width: 200px;
    border-radius: 100px;
    background-color: rgb(240, 197, 43);
    border-color: rgb(209, 154, 0);
    border-style: solid;
    cursor: pointer;
    font-weight: bold;
    margin-right: 10px;
    margin-bottom: 10px;
  }
  .Addtocart-button:hover {
    background-color: rgb(248, 187, 2);
  }
  .signup-button {
    height: 40px;
    width: 100px;
    border-radius: 8px;
    cursor: pointer;
    background-color: green;
    border-style: solid;
    color: white;
    border: none;
    font-weight: bold;
    font-size: 14px;
    transition: box-shadow 0.15s;
    margin-right: 10px;
    margin-bottom: 10px;
  }
  .signup-button:hover {
    box-shadow: 0px 5px 10px rgba(0, 0, 0, 0.5);
    opacity: 0.99;
  }
  .getstarted-button {
    height: 40px;
    width: 120px;
    background-color: rgb(139, 17, 253);
    color: white;
    border: none;
    border-radius: 5px;
    transition: background-color 0.15s;
    margin-bottom: 10px;
    margin-right: 10px;
  }
  .getstarted-button:hover {
    background-color: rgb(86, 2, 164);
  }
  .Download-button {
    height: 30px;
    width: 100px;
    font-size: 11px;
    cursor: pointer;
    background-color: white;
    color: rgb(44, 43, 43);
    border-radius: 4px;
    border-style: solid;
    border-color: rgb(44, 43, 43);
    transition: color 0.15s, background-color 0.15s;
    margin-right: 10px;
    margin-bottom: 10px;
  }
  .Download-button:hover {
    background-color: rgb(44, 43, 43);
    color: white;
  }
  .Apply-button {
    height: 30px;
    width: 190px;
    border-radius: 15px;
    background-color: rgb(3, 115, 220);
    color: white;
    cursor: pointer;
    border-style: solid;
    border-color: rgb(5, 13, 90);
    border-width: 1px;
    transition: background-color 0.5s;
    margin-right: 10px;
    margin-bottom: 10px;
  }
  .Apply-button:hover {
    background-color: rgb(1, 59, 158);
  }
  .Save-button {
    height: 35px;
    width: 70px;
    background-color: white;
    color: rgb(36, 85, 233);
    border-style: solid;
    border-radius: 45px;
    border-width: 1.5px;
    border-color: rgb(36, 85, 233);
    font-weight: bold;
    transition: background-color 0.5s;
  }
  .Save-button:hover {
    background-color: rgba(152, 189, 240, 0.436);
  }
  a:link {
    color: green;
  }
</style>

<button class="Request-button">Request now</button>
<button class="Addtocart-button">Add to Cart</button>
<button class="signup-button">Sign up</button>
<button class="getstarted-button">Get started</button>
<button class="Download-button">Download</button>
<button class="Apply-button">Apply on company website</button>
<button class="Save-button">Save</button>
