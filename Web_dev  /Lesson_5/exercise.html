<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text styles exercise</title>
    <style>
      .a {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        font-weight: bold;
        font-size: 20px;
        margin-bottom: 100px;
      }
      .b {
        font-weight: bolder;
        font-family: Arial, Helvetica, sans-serif;
        margin-bottom: 7px;
        font-size: 23px;
      }
      .bb {
        margin-top: 0;
        font-family: Arial, Helvetica, sans-serif;
        color: rgba(255, 38, 0, 0.819);
        font-style: italic;
        margin-bottom: 100px;
      }
      .c {
        font-family: Verdana, Geneva, Tahoma, sans-serif;
        font-weight: bold;
        font-size: 20px;
        margin-bottom: 7px;
      }
      .cc {
        color: gray;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
        margin-top: 0;
        font-size: 17px;
        margin-bottom: 0;
      }
      .ccc {
        font-family: Verdana, Geneva, Tahoma, sans-serif;
        width: 400px;
      }
      .cccc {
        font-family: Verdana, Geneva, Tahoma, sans-serif;
        background-color: green;
        text-align: center;
        color: white;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <p class="a">This is Tahoma Font</p>
    <p class="b">Biggest Deals of the Year!</p>
    <p class="bb">Sales end Tuesday</p>
    <p class="c">HTML CSS Course</p>
    <p class="cc">Begginer to Pro</p>
    <p class="ccc">
      Lorem, ipsum dolor sit amet consectetur adipisicing elit. Hic, quam!
    </p>
    <p class="cccc">Get Started</p>
  </body>
</html>
