<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
    <title>Registration form</title>
  </head>
  <body>
    <form action="\submit" method="post">
      <label for="name">Enter name:</label>
      <input type="text" required placeholder="name" /><br> </br>
      <label for="email">Email:</label>
      <input type="email" required placeholder="email" /><br> </br>
      <label for="password">Password:</label>
      <input type="password" required minlength="6"><br></br>
      <p>Gender:</p>
      <input type="radio" name="Gender" value="male" placeholder="male" />
      <label for="Gender">male</label>
      <input
        type="radio"
        name="Gender"
        value="Female"
        placeholder="Female"
      />
      <label for="Gender">female</label><br> </br>
      <label for="country">Country:</label>
      <select id="country">
        <option value="india">india</option>
        <option value="usa">usa</option></select
      ><br />
      <p>About You:</p>
      <textarea name="message" id="message" cols="100" rows="5">
write about your self</textarea
      ><br><br>
      <input type="submit" placeholder="register" />
    </form>
  </body>
</html>
